        return s.ready
          ? '<button type="button" class="row" data-go="' + attr(secRoute(part.n, s.id)) + '">' + inner + '</button>'
          : '<div class="row off" aria-disabled="true">' + inner + '</div>';
      }).join('') + '</div>';
  }

  /* ---------- section ---------- */
  function renderSection() {
    var sm = sectionMeta(route.p, route.s);
    var units = unitsOf(route.p, route.s);
    var subs = NOTES.filter(function (n) { return units.some(function (u) { return u.id === n.unit; }); });
    var readyUnits = units.filter(function (u) { return subsOf(u.id).length; });
    var done = countStudied(readyUnits);
    var pct = readyUnits.length ? Math.round(done / readyUnits.length * 100) : 0;
    var qn = QUESTIONS.filter(function (q) { return byId[q.sub]; }).length;
    app.innerHTML =
      '<header><p class="eyebrow">Part ' + route.p + ' · Section ' + route.s + '</p><h1>' + esc(sm.sec.title) + '</h1>' +
      '<p class="meta" style="margin-top:10px"><span><b>' + sm.sec.weight + '%</b> of the exam</span><span><b>' + units.length + '</b> units</span><span><b>' + subs.length + '</b> sub-units ready</span><span><b>' + qn + '</b> practice questions</span></p></header>' +
      '<section class="panel"><div class="meta"><span><b>' + done + ' of ' + readyUnits.length + '</b> units marked as studied</span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<div class="actions"><button type="button" class="btn" data-act="quiz" data-scope="sec" data-key="' + route.s + '"' + (qn ? '' : ' disabled') + '>Practice the whole section (' + qn + ')</button></div></section>' +
      '<h2>Units</h2><div class="rows">' + units.map(function (u) {
        var us = subsOf(u.id);
        if (!us.length) {
          return '<div class="row off unitrow" aria-disabled="true"><span class="k">' + u.id + '</span><span class="rt"><span class="rn">' + esc(u.title) + '</span><span class="rm">' + unitMeta(u) + '</span></span>' +
            '<span class="rp"><span class="pill soon">Coming soon</span></span></div>';
        }
        return '<div class="row rowx unitrow"><button type="button" class="hit" data-go="' + attr(unitRoute(route, u.id)) + '" aria-label="Open ' + esc(u.id + ' ' + u.title) + '"></button>' +
          '<span class="k">' + u.id + '</span><span class="rt"><span class="rn">' + esc(u.title) + stuBtn(u.id, u.title) + '</span><span class="rm">' + unitMeta(u) + '</span>' +
          '</span>' +
          '<span class="rp"><span>' + us.length + ' sub-units</span></span></div>';
      }).join('') + '</div>';
  }

  /* ---------- unit ---------- */
  function renderUnit() {
    var u = unitById[route.u];
    var sm = sectionMeta(route.p, route.s);
    var us = subsOf(u.id);
    var qn = QUESTIONS.filter(function (q) { return byId[q.sub] && q.sub.split('.')[0] === u.id; }).length;
    app.innerHTML =
      '<header><p class="eyebrow">Unit ' + u.id + '</p><h1>' + esc(u.title) + '</h1><p class="lede">' + unitMeta(u) + '</p></header>' +
      '<div class="actions"><button type="button" class="btn" data-act="quiz" data-scope="unit" data-key="' + u.id + '"' + (qn ? '' : ' disabled') + '>Practice this unit (' + qn + ')</button></div>' +
      '<div class="rows">' + us.map(function (n) {
        return '<div class="row rowx"><button type="button" class="hit" data-go="' + attr(subRoute(route, n.id)) + '" aria-label="Open ' + esc(n.id + ' ' + n.title) + '"></button>' +
          '<span class="k">' + n.id + '</span><span class="rt"><span class="rn">' + esc(n.title) + '</span><span class="rm">' + esc(n.summary) + '</span></span></div>';
      }).join('') + '</div>';
  }

  /* ---------- sub-unit notes ---------- */
  /* small > button that opens and closes extra detail, and the panel it controls */
  function moreBtn(id) {
    return ' <button type="button" class="more-btn" aria-expanded="false" aria-controls="' + id + '" aria-label="Show details">' +
      '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true" focusable="false"><path d="M5 2l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
  }
  function morePanel(id, list) {
    return '<div class="more" id="' + id + '" hidden>' + list.map(function (x) { return '<p>' + fmt(x) + '</p>'; }).join('') + '</div>';
  }
  function blockHtml(b, idx) {
    switch (b.t) {
      case 'h': return '<h3 class="nh" id="nh' + idx + '">' + esc(b.text) + '</h3>';
      case 'p':
        /* a paragraph with a "more" list ends in a small > button that opens and closes the extra detail */
        if (b.more && b.more.length) {
          var mid = 'more' + idx;
          return '<div class="pm' + (b.point ? ' pt' : '') + '"><p>' + fmt(b.text) + moreBtn(mid) + '</p>' + morePanel(mid, b.more) + '</div>';
        }
        return '<p' + (b.point ? ' class="pt"' : '') + '>' + fmt(b.text) + '</p>';
      case 'ul': return '<ul>' + b.items.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul>';
      case 'ol': return '<ol>' + b.items.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ol>';
      case 'formula':
        return '<div class="fm">' + (b.title ? '<div class="cap">' + esc(b.title) + '</div>' : '') + b.rows.map(function (r) {
          return '<div class="fr"><span class="fl">' + fmt(r[0]) + '</span>' + (r[1] ? '<span class="fx">' + esc(r[1]) + '</span>' : '') + (r[2] ? '<span class="fn">' + fmt(r[2]) + '</span>' : '') + '</div>';
        }).join('') + '</div>';
      case 'fraction':
        return '<div class="fm fq"><span class="fql">' + fmt(b.left) + '</span><span class="frac"><span class="ft">' + fmt(b.top) + '</span><span class="fb">' + fmt(b.bottom) + '</span></span></div>';
      case 'table':
        return '<div class="tbw"><div class="tbs"><table><thead><tr>' + b.head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
          b.rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + fmt(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
          '</tbody></table></div>' + (b.caption ? '<div class="tc">' + fmt(b.caption) + '</div>' : '') + '</div>';
      case 'example':
        return '<div class="ex"><div class="exh"><span class="tag">Worked example</span><strong>' + esc(b.title) + '</strong></div>' +
          '<div class="given"><div class="cap">Given</div><dl>' + b.given.map(function (g) { return '<div class="grow"><dt>' + esc(g[0]) + '</dt><dd>' + esc(g[1]) + '</dd></div>'; }).join('') + '</dl></div>' +
          '<div class="working">' + b.steps.map(function (s) { return '<span class="ln">' + esc(s) + '</span>'; }).join('') + '<span class="res">' + esc(b.result) + '</span></div>' +
          (b.note ? '<p class="why">' + fmt(b.note) + '</p>' : '') + '</div>';
      case 'terms':
        return '<div class="terms"><div class="cap">Key terms</div><dl>' + b.items.map(function (t) { return '<div class="tr"><dt>' + esc(t[0]) + '</dt><dd>' + fmt(t[1]) + '</dd></div>'; }).join('') + '</dl></div>';
      case 'trap':
        return '<div class="trap"><div class="cap">Exam traps</div><ul>' + b.items.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></div>';
      case 'recall':
        return '<div class="recall"><div class="cap">Quick recall</div><ul>' + b.items.map(function (x) { return '<li>' + fmt(x) + '</li>'; }).join('') + '</ul></div>';
    }
    return '';
  }

  function renderSub() {
    var n = byId[route.sub];
    var u = unitById[n.unit];
    var qn = QUESTIONS.filter(function (q) { return q.sub === n.id; }).length;
    var heads = [];
    n.blocks.forEach(function (b, i) { if (b.t === 'h') heads.push({ i: i, t: b.text }); });
    app.innerHTML =
      '<header class="nhead"><span class="tag" style="align-self:flex-start">' + n.id + '</span><h1>' + esc(n.title) + '</h1>' +
      (n.more && n.more.length ? '<div class="pm"><p class="lede" style="margin-top:0">' + esc(n.summary) + moreBtn('more-sum') + '</p>' + morePanel('more-sum', n.more) + '</div>'
        : '<p class="lede" style="margin-top:0">' + esc(n.summary) + '</p>') +
      (qn ? '<div class="actions"><button type="button" class="btn" data-act="quiz" data-scope="sub" data-key="' + n.id + '">Practice questions (' + qn + ')</button></div>' : '') +
      (heads.length > 1 ? '<div class="toc" aria-label="On this page">' + heads.map(function (h) { return '<button type="button" data-act="toc" data-i="' + h.i + '">' + esc(h.t) + '</button>'; }).join('') + '</div>' : '') +
      '</header>' +
      (n.blocks.length ? '<article class="notes">' + n.blocks.map(blockHtml).join('') + '</article>' : '') +
      (n.topics && n.topics.length ? '<div class="rows">' + n.topics.map(function (t, i) {
        if (!t.blocks.length) return '<div class="row off topicrow" aria-disabled="true"><span class="k">' + toRoman(i + 1) + '</span><span class="rt"><span class="rn">' + esc(t.title) + '</span></span><span class="rp"><span class="pill soon">Coming soon</span></span></div>';
        return '<div class="row rowx topicrow"><button type="button" class="hit" data-go="' + attr(topicRoute(route, n.id, i + 1)) + '" aria-label="Open ' + esc(t.title) + '"></button>' +
          '<span class="k">' + toRoman(i + 1) + '</span><span class="rt"><span class="rn">' + esc(t.title) + '</span></span>' +
          '<span class="rp"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span></div>';
      }).join('') + '</div>' : '') +
      (n.blocks.length && qn ? '<div class="actions"><button type="button" class="btn" data-act="quiz" data-scope="sub" data-key="' + n.id + '">Practice questions (' + qn + ')</button></div>' : '') +
      '';
  }

  /* ---------- topic (inside a sub-unit, listed with Roman numerals) ---------- */
  function renderTopic() {
    var n = byId[route.sub], t = n.topics[route.topic - 1];
    app.innerHTML =
      '<header class="nhead"><span class="tag" style="align-self:flex-start">' + n.id + ' \u00b7 ' + toRoman(route.topic) + '</span><h1>' + esc(t.title) + '</h1></header>' +
      '<article class="notes">' + t.blocks.map(blockHtml).join('') + '</article>';
  }

  /* ---------- quiz ---------- */
  function shuffled(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function poolFor(scope, key) {
    var out = [];
    QUESTIONS.forEach(function (q, k) {
      if (!byId[q.sub]) return;
      if (scope === 'sec' || (scope === 'unit' && q.sub.split('.')[0] === key) || (scope === 'sub' && q.sub === key)) out.push(k);
    });
    return out;
  }
  function label(scope, key) {
    if (scope === 'sub') return key + ' ' + byId[key].title;
    if (scope === 'unit') return 'Unit ' + key + ' ' + unitById[key].title;
    return 'Section ' + key + ' ' + sectionMeta(route.p, key).sec.title;
  }
  function startQuiz(scope, key, subset) {
    var pool = subset || poolFor(scope, key);
    if (!pool.length) return;
    quiz = { scope: scope, key: key, back: route, label: label(scope, key), queue: scope === 'sec' || subset ? shuffled(pool) : pool, i: 0, picked: null, results: [], done: false };
    render();
    window.scrollTo(0, 0);
  }
  function renderQuiz() {
    if (quiz.done) return renderResult();
    var idx = quiz.queue[quiz.i], q = QUESTIONS[idx], answered = quiz.picked !== null;
    var pct = Math.round((quiz.i + (answered ? 1 : 0)) / quiz.queue.length * 100);
    var dataHtml = q.data ? '<div class="given"><div class="cap">Given (US$)</div><dl>' + q.data.map(function (r) { return '<div class="grow"><dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd></div>'; }).join('') + '</dl></div>' : '';
    var opts = q.options.map(function (t, k) {
      var cls = 'opt';
      if (answered) { cls += k === q.answer ? ' correct' : (k === quiz.picked ? ' wrong' : ' dim'); }
      return '<button type="button" class="' + cls + '" data-opt="' + k + '"' + (answered ? ' disabled' : '') + '><span class="key">' + LETTERS[k] + '</span><span class="txt">' + esc(t) + '</span></button>';
    }).join('');
    var fb = '';
    if (answered) {
      var ok = quiz.picked === q.answer, last = quiz.i === quiz.queue.length - 1;
      fb = '<div class="explain' + (ok ? '' : ' miss') + '"><p class="verdict">' + (ok ? 'Correct' : 'Not quite. The answer is ' + LETTERS[q.answer]) + '</p>' +
        '<div class="working">' + q.steps.map(function (s) { return '<span class="ln">' + esc(s) + '</span>'; }).join('') + '<span class="res">' + esc(q.result) + '</span></div>' +
        '<p class="why">' + fmt(q.why) + '</p></div>' +
        '<div class="actions"><button type="button" class="btn" id="next">' + (last ? 'See results' : 'Next question') + '</button></div>';
    }
    app.innerHTML =
      '<div class="topbar"><span class="count">Question ' + (quiz.i + 1) + ' of ' + quiz.queue.length + '</span><span class="right"><span class="tag">' + esc(q.sub) + '</span><button type="button" class="link" data-act="exit">Exit</button></span></div>' +
      '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><i style="width:' + pct + '%"></i></div>' +
      '<section class="panel"><p class="qtext">' + esc(q.q) + '</p>' + dataHtml + '<div class="options" role="group" aria-label="Answer choices">' + opts + '</div></section>' +
      '<div id="feedback" aria-live="polite">' + fb + '</div>';
    if (answered) {
      var nb = document.getElementById('next'); if (nb) nb.focus({ preventScroll: true });
      var f = document.getElementById('feedback'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
  }
  function pick(k) {
    if (!quiz || quiz.done || quiz.picked !== null) return;
    var idx = quiz.queue[quiz.i];
    quiz.picked = k;
    quiz.results.push({ idx: idx, ok: k === QUESTIONS[idx].answer });
    render();
  }
  function nextQ() {
    if (!quiz || quiz.picked === null) return;
    if (quiz.i < quiz.queue.length - 1) { quiz.i++; quiz.picked = null; } else { quiz.done = true; }
    render(); window.scrollTo(0, 0);
  }
  function renderResult() {
    var total = quiz.results.length, right = quiz.results.filter(function (r) { return r.ok; }).length;
    var pct = total ? Math.round(right / total * 100) : 0;
    var msg = pct >= 80 ? 'Strong result. Read the working for anything you missed, then move on.' : pct >= 60 ? 'A solid base. The sub-units marked in red need another pass through the notes.' : 'Go back to the notes for the sub-units in red, then retry the missed questions.';
    var by = {}, order = [];
    quiz.results.forEach(function (r) {
      var s = QUESTIONS[r.idx].sub;
      if (!by[s]) { by[s] = { n: 0, ok: 0 }; order.push(s); }
      by[s].n++; if (r.ok) by[s].ok++;
    });
    order.sort();
    var rows = order.map(function (s) {
      var b = by[s], p = Math.round(b.ok / b.n * 100), cls = p === 100 ? 'strong' : p < 60 ? 'weak' : '';
      return '<div class="r ' + cls + '"><span>' + s + ' ' + esc(byId[s].title) + '</span><span class="sc">' + b.ok + ' / ' + b.n + '</span><div class="bar"><i style="width:' + p + '%"></i></div></div>';
    }).join('');
    var missed = quiz.results.filter(function (r) { return !r.ok; });
    var weakSubs = order.filter(function (s) { return by[s].ok < by[s].n; });
    var missedHtml = missed.length ? '<section class="panel"><h2>Questions to revisit</h2><div class="missed">' + missed.map(function (r) {
      var q = QUESTIONS[r.idx];
      return '<div class="m"><span class="tag" style="align-self:flex-start">' + esc(q.sub) + '</span><p>' + esc(q.q) + '</p><p class="a">Correct answer: <b>' + LETTERS[q.answer] + '. ' + esc(q.options[q.answer]) + '</b></p></div>';
    }).join('') + '</div></section>' : '';
    var review = weakSubs.length ? '<section class="panel"><h2>Review the notes</h2><div class="rows">' + weakSubs.map(function (s) {
      return '<button type="button" class="row" data-go="' + attr({ v: 'sub', p: quiz.back.p, s: quiz.back.s, u: s.split('.')[0], sub: s }) + '"><span class="k">' + s + '</span><span class="rt"><span class="rn">' + esc(byId[s].title) + '</span></span></button>';
    }).join('') + '</div></section>' : '';
    app.innerHTML =
      '<header><p class="eyebrow">Results</p><h1>' + esc(quiz.label) + '</h1></header>' +
      '<section class="panel"><div class="score"><span class="big">' + right + ' / ' + total + '</span><span class="pct">' + pct + '% correct</span></div><p>' + msg + '</p>' +
      '<div class="actions">' + (missed.length ? '<button type="button" class="btn" data-act="retry">Retry missed (' + missed.length + ')</button>' : '') + '<button type="button" class="btn ghost" data-act="exit">Back to the notes</button></div></section>' +
      '<section class="panel"><h2>By sub-unit</h2><div class="brk">' + rows + '</div></section>' + review + missedHtml;
  }

  /* full-form popover for [[ABBR|Full form]] terms */
  var tip = document.createElement('div');
  tip.className = 'tip'; tip.id = 'tip'; tip.setAttribute('role', 'tooltip'); tip.hidden = true;
  document.body.appendChild(tip);
  var tipFor = null;
  function hideTip() {
    if (tipFor) { tipFor.setAttribute('aria-expanded', 'false'); tipFor.removeAttribute('aria-describedby'); }
    tipFor = null; tip.hidden = true;
  }
  function showTip(btn) {
    hideTip();
    tip.textContent = btn.getAttribute('data-full');
    tip.hidden = false;
    var r = btn.getBoundingClientRect(), sx = window.pageXOffset || 0, sy = window.pageYOffset || 0;
    var maxLeft = sx + document.documentElement.clientWidth - tip.offsetWidth - 16;
    tip.style.left = Math.max(sx + 16, Math.min(r.left + sx, maxLeft)) + 'px';
    tip.style.top = (r.bottom + sy + 8) + 'px';
    btn.setAttribute('aria-expanded', 'true'); btn.setAttribute('aria-describedby', 'tip');
    tipFor = btn;
  }

  /* small note that pops up beside the round mark and fades away */
  var toast = document.createElement('div');
  toast.className = 'toast'; toast.setAttribute('role', 'status'); toast.setAttribute('aria-live', 'polite'); toast.hidden = true;
  document.body.appendChild(toast);
  var toastTimer = null, toastHide = null;
  function showToast(anchor, text, good) {
    clearTimeout(toastTimer); clearTimeout(toastHide);
    toast.textContent = text;
    toast.className = 'toast' + (good ? '' : ' off');
    toast.hidden = false;
    var r = anchor.getBoundingClientRect(), sx = window.pageXOffset || 0, sy = window.pageYOffset || 0;
    var w = toast.offsetWidth, h = toast.offsetHeight, vw = document.documentElement.clientWidth;
    var left = r.right + sx + 10, top = r.top + sy + (r.height - h) / 2;
    if (r.right + 10 + w > vw - 12) { left = Math.max(sx + 12, Math.min(r.left + sx, sx + vw - w - 12)); top = r.bottom + sy + 8; }
    toast.style.left = left + 'px'; toast.style.top = top + 'px';
    void toast.offsetWidth;
    toast.className += ' show';
    toastTimer = setTimeout(function () {
      toast.className = toast.className.replace(' show', '');
      toastHide = setTimeout(function () { toast.hidden = true; }, 250);
    }, 1700);
  }
  function toggleStudied(btn) {
    var id = btn.getAttribute('data-id');
    var on = !studied[id];
    if (on) studied[id] = true; else delete studied[id];
    saveStudied();
    Array.prototype.forEach.call(document.querySelectorAll('.stu'), function (el) {
      if (el.getAttribute('data-id') !== id) return;
      el.classList.toggle('on', on); el.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    if (route.v === 'section') {
      var ru = unitsOf(route.p, route.s).filter(function (x) { return subsOf(x.id).length; }), dn = countStudied(ru);
      var pb = document.querySelector('.panel .meta b'); if (pb) pb.textContent = dn + ' of ' + ru.length;
      var pbar = document.querySelector('.panel .bar'); if (pbar) { var w = ru.length ? Math.round(dn / ru.length * 100) : 0; pbar.setAttribute('aria-valuenow', w); pbar.firstChild.style.width = w + '%'; }
    }
    showToast(btn, on ? 'Marked as studied' : 'Removed from studied', on);
    if (btn.focus) btn.focus({ preventScroll: true });
  }

  /* profile card on Home: name, Instagram and a feedback link */
  function toggleProfile(force) {
    var card = document.getElementById('pcard'), btn = document.querySelector('.profile');
    if (!card || !btn) return;
    var open = typeof force === 'boolean' ? force : card.hidden;
    card.hidden = !open; btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }

  /* breadcrumb items for the pinned bottom bar: Part, Section, Unit and Sub-unit pages */
  function crumbItems() {
    var r = route;
    if (quiz || r.v === 'home') return null;
    var items = [{ l: 'Home', r: HOME }];
    if (r.v === 'part') { items.push({ l: 'Part ' + r.p }); return items; }
    items.push({ l: 'Part ' + r.p, r: partRoute(r.p) });
    if (r.v === 'section') { items.push({ l: 'Section ' + r.s }); return items; }
    items.push({ l: 'Section ' + r.s, r: secRoute(r.p, r.s) });
    if (r.v === 'unit') { items.push({ l: r.u }); return items; }
    items.push({ l: r.u, r: unitRoute(r, r.u) });
    if (r.v === 'topic') {
      items.push({ l: r.sub, r: subRoute(r, r.sub) });
      items.push({ l: byId[r.sub].topics[r.topic - 1].title });
      return items;
    }
    items.push({ l: r.sub });
    return items;
  }
  function render() {
    hideTip();
    app.classList.remove('has-bar');
    if (quiz) return renderQuiz();
    if (route.v === 'part') renderPart();
    else if (route.v === 'section') renderSection();
    else if (route.v === 'unit') renderUnit();
    else if (route.v === 'sub') renderSub();
    else if (route.v === 'topic') renderTopic();
    else renderHome();
    var items = crumbItems();
    if (items) {
      app.classList.add('has-bar');
      app.insertAdjacentHTML('beforeend', '<div class="crumbbar"><div class="crumbbar-in">' + crumbs(items, 'big') + '</div></div>');
    }
  }

  /* ---------- events ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target;
    if (!t.closest) return;
    var pf = t.closest('.profile');
    if (pf) { toggleProfile(); return; }
    var st = t.closest('.stu');
    if (st) { toggleStudied(st); return; }
    var mb = t.closest('.more-btn');
    if (mb) {
      var panel = document.getElementById(mb.getAttribute('aria-controls'));
      var open = mb.getAttribute('aria-expanded') !== 'true';
      mb.setAttribute('aria-expanded', open ? 'true' : 'false');
      mb.setAttribute('aria-label', open ? 'Hide details' : 'Show details');
      if (panel) panel.hidden = !open;
      return;
    }
    var ab = t.closest('.abbr');
    if (ab) { if (tipFor === ab) hideTip(); else showTip(ab); return; }
    var opt = t.closest('[data-opt]');
    if (opt) { pick(parseInt(opt.getAttribute('data-opt'), 10)); return; }
    var go = t.closest('[data-go]');
    if (go) { try { nav(JSON.parse(go.getAttribute('data-go'))); } catch (err) {} return; }
    var act = t.closest('[data-act]');
    if (act) {
      var a = act.getAttribute('data-act');
      if (a === 'quiz') startQuiz(act.getAttribute('data-scope'), act.getAttribute('data-key'));
      else if (a === 'toc') {
        var h = document.getElementById('nh' + act.getAttribute('data-i'));
        if (h && h.scrollIntoView) h.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else if (a === 'exit') { var back = quiz ? quiz.back : HOME; quiz = null; route = back; render(); window.scrollTo(0, 0); }
      else if (a === 'retry') {
        var miss = quiz.results.filter(function (r) { return !r.ok; }).map(function (r) { return r.idx; });
        var s = quiz.scope, k = quiz.key; startQuiz(s, k, miss);
      }
      return;
    }
    if (t.closest('#next')) nextQ();
  });
  document.addEventListener('click', function (e) { if (tipFor && !(e.target.closest && e.target.closest('.abbr'))) hideTip(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { hideTip(); toggleProfile(false); } });
  document.addEventListener('click', function (e) { if (e.target.closest && !e.target.closest('.profile') && !e.target.closest('.pcard')) toggleProfile(false); });
  window.addEventListener('resize', hideTip);
  document.addEventListener('keydown', function (e) {
    if (!quiz || quiz.done || quiz.picked !== null || e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key.toLowerCase(), n = 'abcd'.indexOf(k);
    if (n < 0) n = '1234'.indexOf(k);
    if (n >= 0) pick(n);
  });

  render();
})();
</script>

</body></html>
